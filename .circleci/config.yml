jobs:
  run-katalon:
    docker:
      - image: katalonstudio/katalon:10.4.3
    steps:
      - checkout
      - katalon-studio/execute:
          command_arguments: >-
            -retry=0 -testSuitePath="Test Suites/TS01" -browserType="Chrome" -executionProfile="default" -apiKey="a7ff389c-4d29-42ef-9c35-5ae1a39231a8" --config -webui.autoUpdateDrivers=true


